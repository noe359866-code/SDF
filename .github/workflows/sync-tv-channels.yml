name: Sync TV channels to Supabase

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Cantidad máxima de canales únicos a agregar"
        required: false
        default: "20"
        type: string
      activation_mode:
        description: "Modo de activación (automatic o manual)"
        required: false
        default: "automatic"
        type: choice
        options:
          - automatic
          - manual
  schedule:
    # GitHub Actions usa UTC; se ejecuta cada 5 horas (00, 05, 10, 15, 20 UTC).
    - cron: "0 */5 * * *"

concurrency:
  group: sync-tv-channels
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Sincronizar 20 canales únicos y activar disponibles
        run: >-
          python sdf_tv_channels.py
          --all-sources
          --check-streams
          --sync-supabase
          --activation-mode ${{ inputs.activation_mode || 'automatic' }}
          --limit ${{ inputs.limit || '20' }}
          --max-checks 120
          --timeout 10
          --workers 12
          --max-pages 20
          -o data/tv_channels.json

      - name: Guardar resultado del scraper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-channels-${{ github.run_number }}
          path: data/tv_channels.json
          if-no-files-found: ignore
          retention-days: 7
